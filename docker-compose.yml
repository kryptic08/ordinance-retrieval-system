services:
  ordisearch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordisearch-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=*
      - SECRET_KEY=ordisearch-production-secret-key-replace-me
      - WORKER_ENABLED=true
      - DISPOSE_ORIGINALS=true
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
